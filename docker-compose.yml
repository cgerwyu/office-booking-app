services:
  db:
    image: postgres:16
    container_name: officebooking-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}"
#    volumes:
#      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    container_name: officebooking-backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT}"

